services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tgmp
      POSTGRES_PASSWORD: tgmp
      POSTGRES_DB: telegram_marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  app:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BOT_TOKEN: ${BOT_TOKEN}
    ports:
      - "8080:8080"

volumes:
  pgdata:
