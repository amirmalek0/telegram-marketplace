services:
  # ── Infrastructure ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tgmp
      POSTGRES_PASSWORD: tgmp
      POSTGRES_DB: telegram_marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgmp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  dbeaver:
    image: dbeaver/cloudbeaver:latest
    ports:
      - "8978:8978"
    volumes:
      - dbeaverdata:/opt/cloudbeaver/workspace
    depends_on:
      - postgres

  # ── Backend Services (core/) ────────────────────────
  api:
    build:
      context: ./core
      dockerfile: docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SERVICE_NAME: api
      DATABASE_URL: postgres://tgmp:tgmp@postgres:5432/telegram_marketplace?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      BOT_TOKEN: ${BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-qgGm3V/DGE+dobjQh+hiPO1j/r6CsmLa0TkYAdX+/Z4=}
      ADMIN_SEED_USERNAME: ${ADMIN_SEED_USERNAME:-admin}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-admin}
      STORAGE_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-marketplace}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9000/marketplace}
      CATEGORY_ICONS_BUCKET: ${CATEGORY_ICONS_BUCKET:-categories-icons}
      CATEGORY_ICONS_PUBLIC_URL: ${CATEGORY_ICONS_PUBLIC_URL:-http://localhost:9000/categories-icons}
      PRODUCT_FILES_BUCKET: ${PRODUCT_FILES_BUCKET:-product-files}
      PRODUCT_FILES_PUBLIC_URL: ${PRODUCT_FILES_PUBLIC_URL:-http://localhost:9000/product-files}
      PRODUCT_IMAGES_BUCKET: ${PRODUCT_IMAGES_BUCKET:-product-images}
      PRODUCT_IMAGES_PUBLIC_URL: ${PRODUCT_IMAGES_PUBLIC_URL:-http://localhost:9000/product-images}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
      ADDR: ":8080"
    ports:
      # Port 8080 is already used by another local Docker project. Services in
      # this Compose stack still reach the API at api:8080.
      - "${API_PORT:-8082}:8080"
    restart: unless-stopped

  bot:
    build:
      context: ./core
      dockerfile: docker/bot.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SERVICE_NAME: bot
      DATABASE_URL: postgres://tgmp:tgmp@postgres:5432/telegram_marketplace?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      BOT_TOKEN: ${BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-qgGm3V/DGE+dobjQh+hiPO1j/r6CsmLa0TkYAdX+/Z4=}
      ADMIN_SEED_USERNAME: ${ADMIN_SEED_USERNAME:-admin}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-admin}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      STORAGE_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-marketplace}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9000/marketplace}
      CATEGORY_ICONS_BUCKET: ${CATEGORY_ICONS_BUCKET:-categories-icons}
      CATEGORY_ICONS_PUBLIC_URL: ${CATEGORY_ICONS_PUBLIC_URL:-http://localhost:9000/categories-icons}
      PRODUCT_FILES_BUCKET: ${PRODUCT_FILES_BUCKET:-product-files}
      PRODUCT_FILES_PUBLIC_URL: ${PRODUCT_FILES_PUBLIC_URL:-http://localhost:9000/product-files}
      PRODUCT_IMAGES_BUCKET: ${PRODUCT_IMAGES_BUCKET:-product-images}
      PRODUCT_IMAGES_PUBLIC_URL: ${PRODUCT_IMAGES_PUBLIC_URL:-http://localhost:9000/product-images}
      ADDR: ":8081"
    ports:
      - "${BOT_PORT:-8083}:8081"
    restart: unless-stopped

  # ── Frontend Services ───────────────────────────────
  miniapp:
    build:
      context: ./miniapp
      args:
        # Keep browser requests on the Mini App HTTPS origin. The Mini App
        # nginx container proxies /api to the API service over Docker's network.
        VITE_API_BASE_URL: ${MINIAPP_API_URL:-/api/v1}
    depends_on:
      - api
    ports:
      - "3000:80"
    restart: unless-stopped

  backoffice:
    build:
      context: ./backoffice
      args:
        # Use the backoffice origin and let nginx proxy /api to the API container.
        # This avoids browser CORS entirely in the production Docker setup.
        VITE_API_BASE_URL: ${BACKOFFICE_API_URL:-/api/v1}
    depends_on:
      - api
    ports:
      - "3001:80"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  dbeaverdata:
