server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the API service lazily through Docker DNS. Using a variable keeps
    # nginx serving the Mini App even while the API container is temporarily down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same-origin API proxy for HTTPS tunnels and Telegram WebView.
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Expose signed MinIO assets through the same HTTPS origin. The API signs
    # against the internal minio:9000 host, so preserve that Host header.
    location /storage/ {
        set $storage_upstream http://minio:9000;
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass $storage_upstream;
        proxy_set_header Host minio:9000;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
