# Development overrides — use with:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  miniapp:
    build:
      context: ./miniapp
      dockerfile: Dockerfile.dev
    volumes:
      - ./miniapp/src:/app/src
      - ./miniapp/public:/app/public
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_API_PROXY_TARGET: http://api:8080
      VITE_STORAGE_PROXY_TARGET: http://minio:9000
      VITE_STORAGE_SIGNING_HOST: minio:9000
    command: npm run dev -- --host 0.0.0.0 --port 80

  backoffice:
    build:
      context: ./backoffice
      dockerfile: Dockerfile.dev
    volumes:
      - ./backoffice/src:/app/src
      - ./backoffice/public:/app/public
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_API_PROXY_TARGET: http://api:8080
      VITE_STORAGE_PROXY_TARGET: http://minio:9000
      VITE_STORAGE_SIGNING_HOST: minio:9000
    command: npm run dev -- --host 0.0.0.0 --port 80
